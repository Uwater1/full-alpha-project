[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "full-alpha"
version = "0.1.0"
description = "Research-client template for A-Share Alpha Lab"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
full-alpha = "full_alpha.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
